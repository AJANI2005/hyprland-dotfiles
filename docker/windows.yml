services:
  windows:
    image: dockurr/windows
    container_name: windows

    environment:
      DISK_SIZE: 32G
      RAM_SIZE: 4G

    devices:
      - /dev/kvm
      - /dev/net/tun

    cap_add:
      - NET_ADMIN

    ports:
      - "127.0.0.1:8006:8006"
      - "127.0.0.1:3389:3389/tcp"
      - "127.0.0.1:3389:3389/udp"

    volumes:
      - windows:/storage
      - /mnt/shared:/shared
      - ./windows.iso:/custom.iso:ro

    restart: always
    stop_grace_period: 2m

volumes:
  windows:
    external: true

